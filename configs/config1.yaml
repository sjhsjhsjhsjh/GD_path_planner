env:
  rows: 50
  cols: 50
  seed: 2025
  map_size: 100
  action_dim: 4
  # 使用坐标+目标向量+惯导误差作为观测（x,y,dx,dy,ins_error）
  obs_dim: 5
  # INS 误差终止阈值基线：当关闭动态阈值时直接使用该值；
  # 开启动态阈值时作为 default 值与上限裁剪参考。
  ins_error_threshold: 15
  # 是否按“起终点+信标分布”动态计算每个 episode 的 INS 阈值。
  dynamic_ins_error_threshold: true
  # 动态阈值中的“路径走廊半宽”（单位：网格）：
  # 信标到起终点连线的距离 <= corridor_width + beacon_radius 才参与计算。
  dynamic_ins_corridor_width: 4
  # 动态阈值安全系数：
  # raw_threshold = ceil(max_gap_steps * dynamic_ins_safety_factor)
  # 值越大阈值越宽松，值越小越严格。
  dynamic_ins_safety_factor: 0.9
  # 动态阈值下限（最终阈值会被裁剪到 [dynamic_ins_min, dynamic_ins_max] 区间）。
  dynamic_ins_min: 4
  # 动态阈值上限（最终阈值会被裁剪到 [dynamic_ins_min, dynamic_ins_max] 区间）。
  dynamic_ins_max: 15
  init_energy_scale: 1.5
  init_energy_short_scale: 2.0
  init_energy_short_step_threshold: 20
  init_energy_min: 20
  cannot_drive_depth: 0.5
  deep_depth_threshold: 0.13
  # [本地vs服务器区别] 逐步奖励记录开关
  # - 服务器训练时必须设为 false，节省 I/O 与显存（避免队列堆积）
  # - 本地验证/排障时设为 true，生成 step_rewards.csv 明细用于分析
  enable_step_logging: false

runtime:
  # 服务器模式：true 时强制 matplotlib 使用 Agg 无头后端
  server_mode: true

logging:
  # 是否写入 step_rewards.csv（逐步日志）；server 长训建议关闭以降低 I/O
  # - null: 自动策略（server_mode=true 时关闭，其他情况跟随 env.enable_step_logging）
  # - true/false: 显式覆盖自动策略
  enable_step_logging: null
  # 是否启用 episode 级奖励分量累计与写入 train_log.csv
  enable_episode_component_logging: true
  # episode 分量占比口径：
  # - abs_total: 按各分量绝对值占比（推荐，避免正负抵消）
  # - positive_total: 仅按正向分量占比
  episode_ratio_base: abs_total
  

agent:
  gamma: 0.99
  lr: 0.0003
  epsilon_start: 1.0
  epsilon_end: 0.01
  # Q-learning 学习率（alpha）用于表格更新
  alpha: 0.01
  # epsilon 衰减步数（用于指数衰减），可以覆盖为具体训练时的值
  epsilon_decay_steps: 4000

reward:
  # 从“单目标靠近”过渡到“多目标平衡”（靠近、地形、海流、电量）
  step_penalty: 0.06
  # 步惩罚模式：
  # - fixed: 旧逻辑，按固定值逐步惩罚
  # - normalized_with_overtime: 新逻辑，基础惩罚按 step_total 归一化，并在超步后线性加重
  step_penalty_mode: normalized_with_overtime
  # normalized_with_overtime 模式：基础归一化惩罚系数（每步基础项约为 -base_scale / step_total）
  step_penalty_base_scale: 1.2
  # normalized_with_overtime 模式：超步惩罚系数（超出阈值后按超出比例线性增加）
  step_penalty_overtime_scale: 0.8
  # normalized_with_overtime 模式：超步开始阈值 = step_total * ratio
  step_penalty_overtime_start_ratio: 1.0
  out_of_bounds_penalty: 4.0
  energy_exhausted_penalty: 3.0
  ins_diverged_penalty: 3.0
  goal_reward_base: 15.0
  goal_energy_bonus: 5.0
  progress_reward_scale: 20.0
  move_away_penalty_scale: 1.2
  revisit_penalty_base: 0.12
  revisit_penalty_cap: 0.6
  # 地形/海流奖励增强：提高权重并提供分量放大系数
  terrain_reward_weight: 2
  current_reward_weight: 7
  approach_reward_weight: 0.6
  terrain_step_scale: 1
  current_step_scale: 1
  # 海流奖励非对称：
  # - true: 逆流惩罚更重、顺流奖励适度（推荐）
  # - false: 回退到对称海流奖励
  current_asymmetric_reward: true
  # 非对称海流：顺流（alignment>0）增益系数
  current_positive_gain: 0.6
  # 非对称海流：逆流（alignment<0）增益系数，建议 >= current_positive_gain
  current_negative_gain: 1.2
  # 每个 episode 的 current 分量绝对值预算上限；0 表示不启用预算截断
  current_episode_budget_abs: 0.0
  terrain_component_clip: 0.5
  current_component_clip: 0.5
  # 连续能耗（A方案）：每步基础耗能 + 逆流附加耗能
  energy_base_cost: 1.0
  reverse_current_energy_scale: 0.3
  # 能量 shaping 模式：
  # - potential_delta: 使用势函数差分 w * (E_{t+1}/E_init - E_t/E_init)，跨不同路径长度更可比
  # - legacy_step_cost: 旧逻辑，使用 -w * energy_step_cost
  energy_shaping_mode: potential_delta
  # potential_delta 模式下的单步分量裁剪上限（绝对值）；0 表示不裁剪
  energy_potential_clip: 0.2
  energy_reward_weight: 0.05
  beacon_reward_value: 0.2

stage:
  # 固定三阶段调度（A方案）
  schedule_type: episode
  # DQN 推荐 epsilon 曲线：前 5% 探索，中段 35% 平滑过渡，后段低位利用
  ep_phase1_ratio: 0.05
  ep_phase2_ratio: 0.40

buffer:
  # [本地vs服务器重大区别] Replay buffer 容量
  # 当前实现中 replay 以小图元张量 + 字典方式存储，容易产生碎片化
  # - 服务器（30GB RAM + 单卡T4）：保守档推荐 500000-1000000
  #   理论容量足够，但实现开销决定实际可行性
  # - 本地开发/验证：可用 100000-200000 快速迭代
  # 原值 12000000 在当前实现下不可运行（会导致OOM）
  capacity: 1500000

train:
  # 主算法选择：q_learning / double_dqn
  algorithm: double_dqn
  # 训练模式：normal(从头训练) / resume(断点续训)
  mode: normal
  # mode=resume 时指定 checkpoint 文件路径
  resume_checkpoint_path: ""
  total_steps: 50000
  # algorithm: q_learning
  # total_steps: 50000
  # [保守稳跑档] 单卡T4推荐 batch_size=256-512
  # 较低值时 GPU利用率低；过高时容易OOM
  # 当前值 256 需配合 capacity <= 1000000
  batch_size: 256
  target_update: 1000
  eval_interval: 5000
  # Q-learning 专用配置
  max_steps_per_episode: 500
  eval_episodes: 10

checkpoint:
  # 每 N 轮保存一次覆盖式 checkpoint（100覆盖200覆盖300...）
  periodic_interval: 5000
  # 周期checkpoint文件名（固定文件名实现覆盖）
  periodic_filename: dqn_model_periodic.pt
  # 断点续训时默认恢复 replay buffer
  save_buffer: false

dqn:
  # 建议首轮先关闭阶段奖励调度，建立稳态基线
  use_stage_schedule: false
  fixed_stage: optimization
  # [性能优化] DQN 专用 epsilon 曲线
  # - 前 5% 轮次保持高探索
  # - 5%~40% 轮次平滑下降到低位
  # - 后续保持低随机性，兼顾收敛和局部修正
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_phase1_ratio: 0.05
  epsilon_phase2_ratio: 0.40
  # [本地vs服务器区别] replay 存储模式
  # - meta_only: 仅存 scalar/action_feat/patch_meta，采样时按元数据重建 patch
  # - full_patch: 直接存完整 patch（显存占用更高）
  replay_store_mode: meta_only
  # [本地vs服务器区别] replay 内部存储精度
  # - float16: 节省显存，训练时会转换到 float32/AMP 路径
  # - float32: 数值最稳但显存开销更大
  replay_dtype: float16
  # [性能优化] 批量索引 patch 重建
  # - true: 采样时按 batch 一次性索引重建 patch，减少 Python 循环
  # - false: 使用旧的逐样本循环重建路径
  use_batch_patch_indexing: true
  # [本地vs服务器区别] 回放池patch重建开关
  # - 服务器提速试跑：设为 false，避免 sample 阶段大量 patch 重建开销
  # - 本地内存敏感场景：可设为 true，用算力换显存
  reconstruct_patch_on_sample: false
  # [本地vs服务器区别] 地图缓存是否驻留GPU
  # - reconstruct_patch_on_sample=false 时建议设为 false，避免无效显存驻留
  # - reconstruct_patch_on_sample=true 时建议设为 true，减少采样重建的数据搬运
  cache_maps_on_gpu: true
  # [目标先验图缓存限制] 保守档中可降低至 16-32 以进一步节省显存
  goal_prior_cache_size: 32
  patch_small: 11
  patch_large: 21
  hidden_dim: 128
  tau: 0.005
  n_step: 3
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0
  warmup_steps: 2000
  # [保守稳跑档] 每步 GPU 更新迭代数
  # 值越大 GPU 被喂越满，但可能引发显存峰值
  # 当前推荐 2-4，配合 batch_size=256-512 使用
  updates_per_step: 2
  grad_clip: 10.0
  device: cuda
  # [性能优化] 目标先验图按episode缓存
  # - 当前实现每次 encode_observation 都重新计算 goal_prior
  # - 开启后仅在 episode reset 时计算一次，编码阶段直接读取
  # - 推荐始终开启（无副作用，能显著降低CPU开销）
  # - false 时回退到原逐步计算逻辑（用于排障）
  cache_goal_prior: true
  # [性能优化] 预计算全目标 goal_prior 距离库（50x50）
  # - 启用后将先构建目标距离库，再按 denom 生成并缓存 prior
  # - 配合 replay_store_mode=meta_only 可减少重复 patch 存储
  use_precomputed_goal_prior: true
  # [性能优化] 混合精度训练开启
  # - T4 GPU 对 FP16 Tensor Core 友好，可显著加速
  # - 当前实现用 autocast + GradScaler 包裹 loss 计算
  # - 开启时吞吐量通常 +30%-50%，显存占用 -30%-40%
  # - 需在前1000步监控 loss 与梯度，防止数值不稳定
  # - false 时使用标准 FP32 训练（稳定但较慢）
  use_amp: true
  amp_dtype: float16

beacon:
  beacon_config_path: configs/beacons/default_beacons.json
  beacon_signal_area: 5
  beacon_locations:
    -  [19, 6]
    -  [15, 15]
    -  [25, 20]
    -  [25, 36]
    -  [40, 40]
    -  [10, 25]
    -  [12, 36]
    -  [32, 25]
    -  [40, 31]
    -  [6, 6]
    -  [6, 15]
    -  [30, 5]
    -  [40, 5]
    -  [40, 15]
    -  [40, 22]
